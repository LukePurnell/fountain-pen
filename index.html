      { label: 'FADE OUT.', op: 'block', text: 'FADE OUT.\n\n' }
    ],
    scene: [
      { label: 'INT.', op: 'prefix', text: 'INT. ' },
      { label: 'EXT.', op: 'prefix', text: 'EXT. ' },
      { label: '– DAY', op: 'tod', text: 'DAY' },
      { label: '– NIGHT', op: 'tod', text: 'NIGHT' },
      { label: '– CONTINUOUS', op: 'tod', text: 'CONTINUOUS' }
    ],
    character: [
      { label: '(V.O.)', op: 'append', text: ' (V.O.)' },
      { label: '(O.S.)', op: 'append', text: ' (O.S.)' },
      { label: "(CONT'D)", op: 'append', text: " (CONT'D)" },
      { label: 'Dual ^', op: 'append', text: ' ^' },
      { label: 'Dialogue ↵', op: 'type', text: '\n' }
    ],
    dialogue: [
      { label: '(beat)', op: 'paren', text: '(beat)' },
      { label: '(pause)', op: 'paren', text: '(pause)' },
      { label: 'Pause line', op: 'type', text: '\n \n' },
      { label: 'New Char', op: 'block', text: '' },
      { label: 'New Scene', op: 'block', text: 'INT. ' },
      { label: 'End ↵↵', op: 'type', text: '\n\n' }
    ],
    paren: [
      { label: 'beat', op: 'fill', text: 'beat' },
      { label: 'pause', op: 'fill', text: 'pause' },
      { label: 'sotto', op: 'fill', text: 'sotto' },
      { label: 'Done ↵', op: 'type', text: '\n' }
    ],
    transition: [
      { label: 'CUT TO:', op: 'line', text: 'CUT TO:' },
      { label: 'DISSOLVE TO:', op: 'line', text: 'DISSOLVE TO:' },
      { label: 'SMASH CUT TO:', op: 'line', text: 'SMASH CUT TO:' },
      { label: 'MATCH CUT TO:', op: 'line', text: 'MATCH CUT TO:' }
    ]
  };
  const LABEL = { action: 'Action', scene: 'Scene', character: 'Character',
                  dialogue: 'Dialogue', paren: 'Paren', transition: 'Transition' };
  return { SETS, LABEL };
})();

/* ═══════════════════════════════════════════════════════════════════════
   UI — chrome: tabs, drawer, sheet, toast, busy, zoom
   ═══════════════════════════════════════════════════════════════════════ */
const UI = (() => {
  const scrim = U.$('#scrim'), drawer = U.$('#drawer');
  const sheetWrap = U.$('#sheetWrap'), sheet = U.$('#sheet');
  const toastEl = U.$('#toast'), busyEl = U.$('#busy'), busyText = U.$('#busyText');
  let toastTimer = null, onScrim = null;

  let restoreFocus = null;
  function openDrawer() {
    restoreFocus = document.activeElement;
    drawer.dataset.on = '1'; scrim.dataset.on = '1'; onScrim = closeDrawer;
    setTimeout(() => drawer.focus(), 30);
  }
  function closeDrawer() {
    delete drawer.dataset.on; delete scrim.dataset.on; onScrim = null;
    if (restoreFocus && restoreFocus.focus) restoreFocus.focus();
    restoreFocus = null;
  }

  function openSheet(html) {
    sheet.innerHTML = html;
    sheetWrap.dataset.on = '1'; scrim.dataset.on = '1'; onScrim = closeSheet;
    sheet.scrollTop = 0;
    /* Focus the panel, not its first field — focusing an input would throw
       the on-screen keyboard up before the reader has seen the sheet. */
    setTimeout(() => sheet.focus(), 30);
    return sheet;
  }
  function closeSheet() { delete sheetWrap.dataset.on; delete scrim.dataset.on; onScrim = null; }

  scrim.addEventListener('click', () => onScrim && onScrim());

  /* Escape unwinds one layer at a time, topmost first. */
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const shareOpen = U.$('#shareView').hasAttribute('data-on');
    const cardsOpen = U.$('#cardsView').hasAttribute('data-on');
    if (sheetWrap.hasAttribute('data-on')) { closeSheet(); e.preventDefault(); }
    else if (shareOpen) { U.$('#shareClose').click(); e.preventDefault(); }
    else if (cardsOpen) { U.$('#cardsClose').click(); e.preventDefault(); }
    else if (drawer.hasAttribute('data-on')) { closeDrawer(); e.preventDefault(); }
  });
  sheetWrap.addEventListener('click', e => { if (e.target === sheetWrap) closeSheet(); });

  function toast(msg, ms) {
    toastEl.textContent = msg; toastEl.dataset.on = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => delete toastEl.dataset.on, ms || 2200);
  }
  const busy = on => { if (on) { busyText.textContent = typeof on === 'string' ? on : 'Working…'; busyEl.dataset.on = '1'; } else delete busyEl.dataset.on; };

  function confirmSheet({ title, body, danger, ok, then }) {
    const s = openSheet(`<h3>${U.esc(title)}</h3><p class="dim">${body}</p>
      <div class="btns"><button class="btn" data-x>Cancel</button>
      <button class="btn ${danger ? 'dngr' : 'pri'}" data-y>${U.esc(ok || 'Confirm')}</button></div>`);
    U.$('[data-x]', s).onclick = closeSheet;
    U.$('[data-y]', s).onclick = () => { closeSheet(); then(); };
  }

  /* Zoom is expressed as --page-scale on the scroll container. No CSS
     transform and no `zoom` property, so glyphs are rasterised at their
     real size and mobile Safari never inflates them. */
  function makeZoom(view, label) {
    let scale = 1;
    const apply = () => {
      view.style.setProperty('--page-scale', scale);
      if (label) label.textContent = Math.round(scale * 100) + '%';
    };
    const fit = () => requestAnimationFrame(() => {
      const w = view.clientWidth - 18;
      if (w <= 0) { setTimeout(fit, 90); return; }
      scale = Math.min(1, Math.max(.18, w / 816));
      apply();
    });
    return {
      apply, fit,
      set(v) { scale = Math.min(2, Math.max(.18, +v.toFixed(2))); apply(); },
      nudge(d) { this.set(scale + d); },
      get value() { return scale; }
    };
  }

  return { openDrawer, closeDrawer, openSheet, closeSheet, toast, busy, confirmSheet, makeZoom, sheet };
})();

/* ═══════════════════════════════════════════════════════════════════════
   EDITOR — the writing surface

   All text mutations go through put(), which uses execCommand('insertText')
   where available so the browser's own undo stack keeps working. Every
   toolbar button, autocomplete acceptance and voice insertion is therefore
   undoable with ⌘Z / a shake.
   ═══════════════════════════════════════════════════════════════════════ */
const Editor = (() => {
  const el      = U.$('#editor');
  const overlay = U.$('#syntax');
  const acBox   = U.$('#ac');
  const wrap    = U.$('#editWrap');
  const pill    = U.$('#ctxPill');
  const bar     = U.$('#actionbar');
  const sep     = U.$('#barSep');
  const view    = U.$('#previewView');

  const state = { docId: null, parsed: { title: null, tokens: [] }, pageCount: 0, previewDirty: true };
  const zoom = UI.makeZoom(view, U.$('#zLabel'));
  let ac = null;                       // { from, mode, items, sel }

  /* ── text access ───────────────────────────────────────────────────── */
  const text = () => el.value;
  function load(id) {
    state.docId = id;
    el.value = Store.textOf(id);
    el.setSelectionRange(0, 0); el.scrollTop = 0;
    hideAC(); refresh(true); saveNow.cancel();
    setSaveState('saved');
    paintDocName((Store.meta(id) || {}).title);
    Bus.emit('doc', id);
  }
  function put(start, end, insert, selectLen) {
    el.focus();
    el.setSelectionRange(start, end);
    let ok = false;
    try { ok = document.execCommand('insertText', false, insert); } catch {}
    if (!ok) {
      if (!put.warned) { put.warned = true; console.warn('insertText unavailable — undo history will not include toolbar edits.'); }
      const v = el.value;
      el.value = v.slice(0, start) + insert + v.slice(end);
      const c = start + insert.length;
      el.setSelectionRange(c, c);
    }
    if (selectLen) {
      const c = el.selectionStart;
      el.setSelectionRange(c - selectLen, c);
    }
    refresh();
  }
  const type = s => put(el.selectionStart, el.selectionEnd, s);

  /* ── context ───────────────────────────────────────────────────────── */
  function context() {
    const v = el.value, pos = el.selectionStart;
    const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
    let lineEnd = v.indexOf('\n', pos); if (lineEnd < 0) lineEnd = v.length;
    const line = v.slice(lineStart, lineEnd);
    const beforeInLine = v.slice(lineStart, pos);

    const upto = v.slice(0, lineEnd).split('\n');
    const idx = upto.length - 1;
    let top = idx;
    while (top > 0 && upto[top - 1].length > 0) top--;
    const head = (upto[top] || '').trim();
    const depth = idx - top;
    const t = line.trim();

    let kind = 'action';
    if (depth === 0) {
      if (/^\.[^.\s]/.test(t)) kind = 'scene';
      else if (t.startsWith('@')) kind = 'character';
      else if (t.startsWith('!') || t.startsWith('~')) kind = 'action';
      else if (Fountain.RE.scene.test(t)) kind = 'scene';
      else if (Fountain.RE.transition.test(t) || /^>(?!.*<\s*$)/.test(t)) kind = 'transition';
      else if (Fountain.isCue(t)) kind = 'character';
    } else {
      const cue = head.startsWith('@') || Fountain.isCue(head);
      if (cue) kind = Fountain.RE.paren.test(t) || (t.startsWith('(') && !t.endsWith(')')) ? 'paren' : 'dialogue';
    }
    return { kind, pos, line, lineStart, lineEnd, beforeInLine, depth, head };
  }

  /* ── refresh cycle ───────────────────────────────────────────────────
     Two tiers. The cheap tier runs on every keystroke and only touches
     things the writer perceives instantly — the context pill and the
     suggestion list, both of which read the raw text. The expensive tier
     (re-parse, pagination, stats, syntax overlay) is coalesced, because on
     a feature-length script it is an order of magnitude dearer and nobody
     can read a page count that updates 40 times a second.                */
  function refresh(immediate) {
    paintBar();
    paintAC();
    saveNow();
    if (immediate) heavy(true); else scheduleHeavy();
  }
  const scheduleHeavy = U.debounce(() => heavy(false), 140);
  const schedulePreview = U.debounce(() => drawPreview(), 200);

  function heavy(immediate) {
    try {
      state.parsed = Fountain.parse(el.value);
      Complete.refresh(state.parsed.tokens);
      paintStats();
      paintSyntax();
    } catch (err) {
      /* A parser fault must not silently freeze the editor. */
      console.error('parse failed', err);
      setSaveState('error', 'Formatting error');
      return;
    }
    state.previewDirty = true;
    if (Bus.state.pane === 'preview') { if (immediate) drawPreview(); else schedulePreview(); }
    Bus.emit('changed');
  }

  function drawPreview() {
    if (!state.previewDirty && view.firstChild) { zoom.apply(); return; }
    const { html, pages } = Render.document(state.parsed);
    view.innerHTML = html;
    state.pageCount = pages.length;
    state.previewDirty = false;
    zoom.apply();
  }

  function paintStats() {
    const words = U.words(el.value);
    const pages = Layout.paginate(state.parsed.tokens).length;
    state.pageCount = pages;
    U.$('#stWords').textContent = words + (words === 1 ? ' word' : ' words');
    U.$('#stPages').textContent = pages + (pages === 1 ? ' page' : ' pages');
    U.$('#stTime').textContent  = Layout.clock(Layout.minutes(state.parsed.tokens));
  }

  let syntaxOf = null;
  function paintSyntax() {
    if (!Store.prefs.syntax) { syntaxOf = null; return; }
    const src = el.value;
    if (src !== syntaxOf) { overlay.innerHTML = Syntax.build(src); syntaxOf = src; }
    overlay.scrollTop = el.scrollTop;
    overlay.scrollLeft = el.scrollLeft;
  }

  /* ── action bar ────────────────────────────────────────────────────── */
  let barKind = null;
  function paintBar() {
    const { kind } = context();
    if (kind === barKind) return;
    barKind = kind;
    pill.textContent = ActionBar.LABEL[kind] || 'Action';
    let n = bar.firstElementChild;
    while (n && n !== sep) { const next = n.nextElementSibling; if (n !== pill) n.remove(); n = next; }
    (ActionBar.SETS[kind] || ActionBar.SETS.action).forEach(a => {
      const b = document.createElement('button');
      b.className = 'act'; b.textContent = a.label;
      b.addEventListener('pointerdown', e => { e.preventDefault(); runAction(a); });
      bar.insertBefore(b, sep);
    });
  }

  function leadBlank() {
    const before = el.value.slice(0, el.selectionStart);
    if (!before) return '';
    if (before.endsWith('\n\n')) return '';
    if (before.endsWith('\n')) return '\n';
    return '\n\n';
  }

  function runAction(a) {
    const c = context();
    switch (a.op) {
      case 'type':
      case 'append': type(a.text); break;
      case 'block':  type(leadBlank() + a.text); break;
      case 'paren':  type('\n' + a.text + '\n'); break;
      case 'fill': {
        if (/^\(\s*\)$/.test(c.line.trim())) put(c.lineStart, c.lineEnd, '(' + a.text + ')');
        else type('(' + a.text + ')');
        break;
      }
      case 'line': {
        const pad = c.lineStart === 0 || el.value.slice(c.lineStart - 2, c.lineStart) === '\n\n' ? '' : '\n';
        put(c.lineStart, c.lineEnd, pad + a.text);
        break;
      }
      case 'prefix': {
        const m = c.line.match(/^(INT\.?\/EXT\.?|I\/E|INT\.?|EXT\.?|EST\.?)\s+([\s\S]*)$/i);
        put(c.lineStart, c.lineEnd, a.text + (m ? m[2] : c.line.trim()));
        break;
      }
      case 'tod': {
        const base = c.line.replace(/\s+[-–—]\s+.*$/, '').trimEnd();
        put(c.lineStart, c.lineEnd, base + ' - ' + a.text);
        break;
      }
    }
  }

  const SNIPPETS = {
    scene:  () => ({ text: leadBlank() + 'INT. ' }),
    char:   () => ({ text: leadBlank() }),
    paren:  () => ({ text: '\n(beat)\n', select: 0 }),
    trans:  () => ({ text: leadBlank() + 'CUT TO:\n\n' }),
    section:() => ({ text: leadBlank() + '# ' }),
    break:  () => ({ text: leadBlank() + '===\n\n' })
  };
  const WRAPS = { bold: ['**', '**', 'bold'], ital: ['*', '*', 'italic'],
                  under: ['_', '_', 'underline'], note: ['[[', ']]', 'note'],
                  center: ['> ', ' <', 'centered'] };

  function insert(name) {
    if (SNIPPETS[name]) { const s = SNIPPETS[name](); type(s.text); return; }
    const w = WRAPS[name];
    if (!w) return;
    const s = el.selectionStart, e = el.selectionEnd;
    const had = el.value.slice(s, e);
    const chosen = had || w[2];
    put(s, e, w[0] + chosen + w[1]);
    if (!had) {                       // nothing was selected → select the placeholder word
      const caret = el.selectionStart - w[1].length;
      el.setSelectionRange(caret - chosen.length, caret);
    }
  }

  /* ── autocomplete ──────────────────────────────────────────────────── */
  function paintAC() {
    const s = Complete.suggest(context());
    if (!s) return hideAC();
    ac = { ...s, sel: 0 };
    acBox.innerHTML = s.items.map((it, i) =>
      `<div class="ac-row"${i === 0 ? ' data-sel' : ''} data-i="${i}">` +
      `<span>${U.esc(it.label || it.value)}</span><em>${it.kind}</em></div>`).join('');
    placeAC();
    acBox.dataset.on = '1';
  }
  function placeAC() {
    const cs = getComputedStyle(el);
    const lh = parseFloat(cs.lineHeight) || 24;
    const pt = parseFloat(cs.paddingTop) || 14;
    const row = el.value.slice(0, el.selectionStart).split('\n').length - 1;
    const caretY = pt + row * lh - el.scrollTop;
    const h = Math.min(178, acBox.scrollHeight || 178);
    let top = caretY + lh + 5;
    if (top + h > wrap.clientHeight - 8) top = caretY - h - 5;
    acBox.style.top = Math.max(6, Math.min(top, wrap.clientHeight - h - 6)) + 'px';
    acBox.style.left = '14px';
  }
  function hideAC() { ac = null; delete acBox.dataset.on; }
  function moveAC(d) {
    if (!ac) return;
    ac.sel = (ac.sel + d + ac.items.length) % ac.items.length;
    U.$$('.ac-row', acBox).forEach((r, i) => i === ac.sel ? r.dataset.sel = '1' : delete r.dataset.sel);
    const cur = acBox.children[ac.sel];
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  function acceptAC(i) {
    if (!ac) return;
    const item = ac.items[i == null ? ac.sel : i];
    if (!item) return;
    const from = ac.from, to = el.selectionStart, mode = ac.mode;
    hideAC();
    put(from, to, item.value + Complete.tail(mode));
  }
  acBox.addEventListener('pointerdown', e => {
    const row = e.target.closest('.ac-row'); if (!row) return;
    e.preventDefault(); acceptAC(+row.dataset.i);
  });

  /* ── saving ────────────────────────────────────────────────────────── */
  function setSaveState(s, msg) {
    const n = U.$('#saveState');
    n.dataset.s = s;
    n.textContent = msg || (s === 'saving' ? 'Saving…' : s === 'error' ? 'Save failed' : 'Saved');
  }
  const saveNow = U.debounce(() => {
    if (!state.docId) return;
    const ok = Store.saveText(state.docId, el.value);
    const title = (state.parsed.title && state.parsed.title.title) || firstSceneTitle() || 'Untitled';
    Store.patchMeta(state.docId, { title, words: U.words(el.value), updated: U.when(Date.now()) });
    paintDocName(title);
    setSaveState(ok ? 'saved' : 'error');
    Bus.emit('saved');
  }, 420);
  const paintDocName = t => { U.$('#docName').textContent = t || 'Untitled'; };

  function firstSceneTitle() {
    const s = state.parsed.tokens.find(t => t.type === 'scene');
    return s ? Fountain.plain(s.text).slice(0, 40) : null;
  }
  function flush() { saveNow.now(); }

  /* ── events ────────────────────────────────────────────────────────── */
  el.addEventListener('input', () => { setSaveState('saving'); refresh(); });
  el.addEventListener('click', () => { hideAC(); paintBar(); });
  el.addEventListener('scroll', () => {
    if (Store.prefs.syntax) { overlay.scrollTop = el.scrollTop; overlay.scrollLeft = el.scrollLeft; }
    if (ac) placeAC();
  });
  el.addEventListener('blur', () => setTimeout(hideAC, 160));
  el.addEventListener('keyup', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(e.key)) { paintBar(); paintAC(); }
  });
  el.addEventListener('keydown', e => {
    if (ac) {
      if (e.key === 'ArrowDown') { e.preventDefault(); return moveAC(1); }
      if (e.key === 'ArrowUp')   { e.preventDefault(); return moveAC(-1); }
      if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); return acceptAC(); }
      if (e.key === 'Escape')    { e.preventDefault(); return hideAC(); }
    }
    if (e.key === 'Tab') { e.preventDefault(); return type('    '); }
    if ((e.metaKey || e.ctrlKey) && !e.altKey) {
      const k = e.key.toLowerCase();
      if (k === 's') { e.preventDefault(); flush(); UI.toast('Saved'); }
      if (k === 'f') { e.preventDefault(); Features.find(); }
      if (k === 'p') { e.preventDefault(); App.showPane('preview'); }
      if (k === 'b') { e.preventDefault(); insert('bold'); }
      if (k === 'i') { e.preventDefault(); insert('ital'); }
      if (k === 'u') { e.preventDefault(); insert('under'); }
    }
  });
  U.$$('#actionbar .ins').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); insert(b.dataset.ins); }));

  /* ── jump helpers ──────────────────────────────────────────────────── */
  function goto(pos, select) {
    App.showPane('write');
    setTimeout(() => {
      el.focus();
      el.setSelectionRange(pos, select ? pos + select : pos);
      const row = el.value.slice(0, pos).split('\n').length;
      const lh = parseFloat(getComputedStyle(el).lineHeight) || 24;
      el.scrollTop = Math.max(0, (row - 4) * lh);
      paintBar();
    }, 60);
  }
  function gotoScene(n) {
    const lines = el.value.split('\n');
    let count = 0, pos = 0;
    for (let i = 0; i < lines.length; i++) {
      const t = lines[i].trim();
      const blockStart = i === 0 || lines[i - 1].length === 0;
      if ((blockStart && Fountain.RE.scene.test(t)) || /^\.[^.\s]/.test(t)) {
        if (++count === n) { pos = lines.slice(0, i).join('\n').length + (i ? 1 : 0); break; }
      }
    }
    goto(pos);
  }

  return { el, state, zoom, text, load, put, type, insert, context, refresh,
           drawPreview, flush, goto, gotoScene, setSaveState, hideAC,
           get parsed() { return state.parsed; },
           get docId() { return state.docId; } };
})();

/* ═══════════════════════════════════════════════════════════════════════
   CARDS — scene cards with timing, reordering and jump-to
   ═══════════════════════════════════════════════════════════════════════ */
const Cards = (() => {
  const viewEl = U.$('#cardsView'), list = U.$('#cardList'), meta = U.$('#cardsMeta');

  /* Source line ranges for each scene, so reordering can rewrite the text. */
  function ranges(text) {
    const lines = text.split('\n');
    const starts = [];
    lines.forEach((l, i) => {
      const t = l.trim();
      const blockStart = i === 0 || lines[i - 1].length === 0;
      if ((blockStart && Fountain.RE.scene.test(t)) || /^\.[^.\s]/.test(t)) starts.push(i);
    });
    return { lines, starts };
  }

  function model() {
    const toks = Editor.parsed.tokens;
    const out = [];
    let cur = null;
    const push = () => { if (cur) { cur.mins = Layout.minutes(cur.toks); out.push(cur); } };
    toks.forEach(t => {
      if (t.type === 'scene') { push(); cur = { n: out.length + 1, head: t.text, num: t.sceneNum, action: '', who: [], toks: [t] }; return; }
      if (!cur) return;
      cur.toks.push(t);
      if (t.type === 'action' && !cur.action) cur.action = Fountain.plain(t.text).replace(/\n/g, ' ').slice(0, 140);
      const names = t.type === 'dual'
        ? t.left.concat(t.right).filter(x => x.type === 'character').map(x => x.text)
        : t.type === 'character' ? [t.text] : [];
      names.forEach(nm => { const c = Layout.cueName(nm); if (c && !cur.who.includes(c)) cur.who.push(c); });
    });
    push();
    return out;
  }

  function draw() {
    const cards = model();
    const total = cards.reduce((s, c) => s + c.mins, 0);
    meta.textContent = `${cards.length} ${cards.length === 1 ? 'scene' : 'scenes'} · ${Layout.clock(total)}`;
    if (!cards.length) {
      list.innerHTML = '<div class="hint">No scene headings yet.<br>Add an INT. or EXT. line to build your cards.</div>';
      return;
    }
    list.innerHTML = cards.map((c, i) => {
      const pct = Math.min(100, c.mins / 5 * 100).toFixed(1);
      return `<div class="scard ${Layout.pace(c.mins)}" data-i="${i}" draggable="true">
        <div class="n">Scene ${c.n}${c.num ? ' · #' + U.esc(c.num) + '#' : ''}</div>
        <div class="h">${U.esc(Fountain.plain(c.head))}</div>
        ${c.action ? `<div class="a">${U.esc(c.action)}</div>` : ''}
        ${c.who.length ? `<div class="who">${c.who.slice(0, 5).map(w => `<b>${U.esc(w)}</b>`).join('')}</div>` : ''}
        <div class="tm">
          <button class="btn sm" data-mv="-1" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="btn sm" data-mv="1" ${i === cards.length - 1 ? 'disabled' : ''}>↓</button>
          <i><b style="width:${pct}%"></b></i><u>${Layout.span(c.mins)}</u>
        </div></div>`;
    }).join('');
  }

  function reorder(from, to) {
    const { lines, starts } = ranges(Editor.text());
    if (starts.length < 2 || from === to) return;
    const chunks = starts.map((s, i) => {
      let end = (i < starts.length - 1 ? starts[i + 1] - 1 : lines.length - 1);
      while (end > s && lines[end].trim() === '') end--;
      return lines.slice(s, end + 1).join('\n');
    });
    const head = lines.slice(0, starts[0]).join('\n').replace(/\s+$/, '');
    const moved = chunks.splice(from, 1)[0];
    chunks.splice(to, 0, moved);
    const next = (head ? head + '\n\n' : '') + chunks.join('\n\n') + '\n';
    Editor.put(0, Editor.text().length, next);
    draw();
  }

  list.addEventListener('click', e => {
    const mv = e.target.closest('[data-mv]');
    const card = e.target.closest('.scard');
    if (!card) return;
    const i = +card.dataset.i;
    if (mv) { e.stopPropagation(); reorder(i, i + (+mv.dataset.mv)); return; }
    close(); Editor.gotoScene(i + 1);
  });

  let dragFrom = null;
  list.addEventListener('dragstart', e => {
    const c = e.target.closest('.scard'); if (!c) return;
    dragFrom = +c.dataset.i; c.dataset.drag = '1';
    e.dataTransfer.effectAllowed = 'move';
  });
  list.addEventListener('dragend', e => { U.$$('.scard', list).forEach(c => { delete c.dataset.drag; delete c.dataset.over; }); });
  list.addEventListener('dragover', e => {
    const c = e.target.closest('.scard'); if (!c) return;
    e.preventDefault();
    U.$$('.scard', list).forEach(x => delete x.dataset.over);
    c.dataset.over = '1';
  });
  list.addEventListener('drop', e => {
    const c = e.target.closest('.scard'); if (!c || dragFrom == null) return;
    e.preventDefault(); reorder(dragFrom, +c.dataset.i); dragFrom = null;
  });

  const open = () => { UI.closeDrawer(); draw(); viewEl.dataset.on = '1'; };
  const close = () => delete viewEl.dataset.on;
  U.$('#cardsClose').addEventListener('click', close);

  return { open, close, draw, model };
})();

/* ═══════════════════════════════════════════════════════════════════════
   SHARE — the whole screenplay travels inside the URL

   Text is tidied, deflate-compressed and base64url-encoded into the hash.
   No server, no account, no expiry. Opening such a link shows a read-only
   formatted viewer with a one-tap Save into the reader's own library.
   ═══════════════════════════════════════════════════════════════════════ */
const Share = (() => {
  const viewEl = U.$('#shareView'), vp = U.$('#shareViewport');
  const zoom = UI.makeZoom(vp, U.$('#szLabel'));
  let payload = '', link = '';

  /* Shrinking the input before deflate is the cheapest real win: trailing
     spaces and runs of blank lines cost bytes but carry no meaning. */
  const tidy = t => String(t)
    .replace(/\r\n?/g, '\n')
    .split('\n').map(l => l.replace(/[ \t]+$/, '')).join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim() + '\n';

  const b64url = bytes => {
    let s = ''; const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };
  const unb64url = str => {
    const p = str.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(p + '==='.slice((p.length + 3) % 4));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };
  async function pipe(bytes, stream) {
    const w = stream.writable.getWriter(); w.write(bytes); w.close();
    const chunks = []; const r = stream.readable.getReader();
    for (;;) { const { done, value } = await r.read(); if (done) break; chunks.push(value); }
    const out = new Uint8Array(chunks.reduce((n, c) => n + c.length, 0));
    let o = 0; for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  }

  async function encode(text) {
    const bytes = new TextEncoder().encode(tidy(text));
    if (!window.CompressionStream) return 'u' + b64url(bytes);
    return 'z' + b64url(await pipe(bytes, new CompressionStream('deflate-raw')));
  }
  async function decode(blob) {
    const kind = blob[0], body = unb64url(blob.slice(1));
    if (kind === 'u') return new TextDecoder().decode(body);
    if (!window.DecompressionStream) throw new Error('This browser cannot open compressed links.');
    return new TextDecoder().decode(await pipe(body, new DecompressionStream('deflate-raw')));
  }

  async function create() {
    UI.closeDrawer();
    UI.busy('Building link…');
    try {
      const blob = await encode(Editor.text());
      link = location.href.split('#')[0] + '#s=' + blob;
      payload = Editor.text();
      UI.busy(false);

      const p = Fountain.parse(payload);
      const title = (p.title && p.title.title) || 'Untitled Screenplay';
      const kb = (link.length / 1024).toFixed(1);
      const big = link.length > 8000;
      const ratio = Math.round(100 - link.length / Math.max(1, payload.length) * 100);

      const s = UI.openSheet(`<h3>Share as Link</h3>
        <p class="dim">Anyone with this link can read <b style="color:var(--ink)">${U.esc(title)}</b>
        formatted, in their browser. No account needed and it never expires.</p>
        <div class="card" style="font-size:11px;word-break:break-all;color:var(--gold)" id="shLink">${U.esc(link)}</div>
        <p class="dim" style="color:${big ? 'var(--red)' : 'var(--ink-faint)'}">
          ${kb} KB${ratio
