<!DOCTYPE html>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   1. TOKENS
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#16150f; --bg-1:#1e1d16; --bg-2:#282619; --rule:#3a3729;
  --ink:#ece7db; --ink-dim:#8f8a7a; --ink-faint:#5d5949;
  --gold:#d8a86a; --gold-dim:#8f7045; --gold-deep:#5c4726;
  --red:#cf7368; --green:#7db787;
  --paper:#f3ecdb; --paper-ink:#211e16;
  --shadow:0 10px 34px rgba(0,0,0,.55);
  --mono:'Courier Prime',ui-monospace,'Courier New',monospace;
  --serif:'Cormorant Garamond',Georgia,serif;
  --page-scale:1;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;height:100%;min-height:100dvh;max-height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--ink);font-family:var(--mono);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--gold-deep);color:var(--ink)}

/* ═══════════════════════════════════════════════════════════════════════
   2. APP CHROME  (header · tabs · bars · main)
   Body is the flex column. Everything except <main> is flex:0 0 auto so
   the keyboard can only ever shrink <main>.
   ═══════════════════════════════════════════════════════════════════════ */
header{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:4px 10px;padding-top:max(4px,var(--safe-t));
  background:var(--bg);border-bottom:1px solid var(--rule);z-index:6;
}
.brand{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.4px;white-space:nowrap}
.brand i{color:var(--gold);font-style:normal;margin:0 2px}
.doc-name{
  flex:1;min-width:0;font-size:11px;color:var(--ink-dim);letter-spacing:.3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;
}
.icon-btn{
  flex:0 0 auto;width:28px;height:28px;border-radius:6px;font-size:14px;
  background:none;border:1px solid var(--rule);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{background:var(--bg-2)}

.tabs{flex:0 0 auto;display:flex;background:var(--bg);border-bottom:1px solid var(--rule)}
.tab{
  flex:1;padding:6px 10px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--ink-dim);font-family:var(--serif);font-size:13px;
  letter-spacing:1.6px;text-transform:uppercase;transition:color .18s,border-color .18s;
}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}

/* Action bar + stats live on body, never inside the scroll area */
#bars{flex:0 0 auto;display:none;flex-direction:column}
body[data-mode="write"] #bars{display:flex}

#actionbar{
  display:flex;align-items:center;gap:5px;min-height:38px;padding:5px 8px;
  background:var(--bg-1);border-bottom:1px solid var(--rule);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
#actionbar::-webkit-scrollbar{display:none}
.ctx-pill{
  flex:0 0 auto;font-size:9px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--bg);background:var(--gold-dim);padding:2px 7px;border-radius:9px;white-space:nowrap;
}
.act{
  flex:0 0 auto;padding:5px 10px;border-radius:13px;white-space:nowrap;
  background:transparent;border:1px solid var(--gold-dim);color:var(--gold);font-size:11px;
}
.act:active{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.bar-sep{flex:0 0 auto;width:1px;height:18px;background:var(--rule);margin:0 3px}
.ins{
  flex:0 0 auto;padding:5px 8px;border-radius:4px;white-space:nowrap;
  background:var(--bg);border:1px solid var(--rule);color:var(--ink-dim);font-size:11px;
}
.ins:active{background:var(--gold);border-color:var(--gold);color:var(--bg)}

#statusbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:4px 12px;font-size:10px;letter-spacing:.4px;color:var(--ink-faint);
  background:var(--bg-1);border-bottom:1px solid var(--rule);
}
#statusbar b{font-weight:400;color:var(--ink-dim)}
#saveState{white-space:nowrap}
#saveState[data-s="saving"]{color:var(--gold)}
#saveState[data-s="saved"]{color:var(--ink-faint)}
#saveState[data-s="error"]{color:var(--red);font-weight:700}

/* Notice strips (linked file / storage) */
.strip{
  flex:0 0 auto;display:none;align-items:center;gap:8px;
  padding:4px 12px;font-size:10px;letter-spacing:.4px;
}
.strip[data-on]{display:flex}
.strip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip button{background:none;border:1px solid currentColor;border-radius:4px;
  color:inherit;font-size:9px;padding:2px 7px;opacity:.85}
#fileStrip{background:#11200f;border-bottom:1px solid #22401f;color:var(--green)}
#fileStrip[data-state="stale"]{background:#2a2410;border-bottom-color:#4a3f1a;color:var(--gold)}
#storageStrip{background:#2a1512;border-bottom:1px solid #4a201a;color:var(--red)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.dot[data-s="sync"]{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

main{flex:1 1 0;min-height:0;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.pane[data-on]{display:flex}

/* ═══════════════════════════════════════════════════════════════════════
   3. EDITOR  (syntax overlay sits behind a transparent textarea)
   ═══════════════════════════════════════════════════════════════════════ */
#editWrap{flex:1;position:relative;min-height:0;display:flex;background:var(--bg)}
#editor,#syntax{
  margin:0;border:0;width:100%;
  padding:14px 14px calc(14px + var(--safe-b)) 14px;
  font-family:var(--mono);font-size:15px;line-height:1.62;
  letter-spacing:0;tab-size:4;
  white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;
}
#editor{
  flex:1;min-height:0;resize:none;outline:none;background:transparent;
  color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;
  position:relative;z-index:2;-webkit-appearance:none;border-radius:0;
}
#syntax{
  position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;
  display:none;color:transparent;
}
body[data-syntax] #syntax{display:block}
body[data-syntax] #editor{color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ink)}

/* token colours */
.t-key{color:#82c7e8}    .t-val{color:#d9a077}
.t-scene{color:#6fb4e8;font-weight:700}
.t-num{color:#6d6a5c}
.t-char{color:#e0cf87;font-weight:700}
.t-dual{color:#cd90cd;font-weight:700}
.t-paren{color:#79907a}
.t-dlg{color:#cdc8bb}
.t-act{color:#9fbfd4}
.t-trans{color:#cd90cd;font-weight:700}
.t-ctr{color:#cd90cd}
.t-sec{color:#68c2ab;font-weight:700}
.t-syn{color:#6f9960;font-style:italic}
.t-note{color:#6f9960;background:rgba(111,153,96,.16);border-radius:2px}
.t-lyric{color:#d9a077;font-style:italic}
.t-brk{color:#4b4839}
.t-b{font-weight:700} .t-i{font-style:italic} .t-u{text-decoration:underline}

/* autocomplete */
#ac{
  position:absolute;z-index:20;display:none;min-width:150px;max-width:78vw;
  max-height:178px;overflow-y:auto;border-radius:8px;
  background:var(--bg-2);border:1px solid var(--gold-dim);box-shadow:0 8px 22px rgba(0,0,0,.6);
}
#ac[data-on]{display:block}
.ac-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 11px;font-size:13px;border-bottom:1px solid var(--rule);
  white-space:nowrap;overflow:hidden;
}
.ac-row:last-child{border-bottom:none}
.ac-row[data-sel]{background:var(--gold);color:var(--bg)}
.ac-row em{font-style:normal;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.ac-row[data-sel] em{color:var(--bg)}

/* ═══════════════════════════════════════════════════════════════════════
   4. PAGE  (preview + print + share viewer)
   --in is one inch. Everything on the page is expressed in inches so the
   HTML preview and the PDF share one geometry.  Natural page = 816px wide
   (8.5in × 96dpi); --page-scale shrinks it to fit without transform/zoom,
   so text renders at true pixel size and iOS never inflates it.
   ═══════════════════════════════════════════════════════════════════════ */
.viewport{
  flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  background:#0c0b07;padding:14px 8px calc(14px + var(--safe-b)) 8px;
  -webkit-text-size-adjust:none;text-size-adjust:none;
}
/* Every inch below comes from Layout.G via App.applyGeometry(); nothing
   here restates the page geometry, so JS and CSS cannot drift apart. */
.page{
  --in:calc(96px * var(--page-scale));
  --ln:calc(var(--in) / 6);
  width:calc(var(--pg-w) * var(--in));
  min-height:calc(var(--pg-h) * var(--in));
  margin:0 auto calc(.25 * var(--in));
  padding:calc(var(--m-t) * var(--in)) calc(var(--m-r) * var(--in))
          calc(var(--m-b) * var(--in)) calc(var(--m-l) * var(--in));
  position:relative;background:var(--paper);color:var(--paper-ink);
  font-family:var(--mono);font-size:calc(16px * var(--page-scale));
  line-height:var(--ln);box-shadow:var(--shadow);
}
.page::after{
  content:attr(data-folio);position:absolute;
  top:calc(.5 * var(--in));right:calc(var(--m-r) * var(--in));
  font-size:calc(16px * var(--page-scale));
}
.e-scene{text-transform:uppercase;font-weight:700;margin:var(--ln) 0 var(--ln)}
.e-scene.num{position:relative}
.e-scene .sn-l,.e-scene .sn-r{position:absolute;font-weight:400;white-space:nowrap}
.e-scene .sn-l{left:calc(var(--sn-l) * var(--in) * -1)}
.e-scene .sn-r{right:calc(var(--sn-r) * var(--in) * -1)}
.e-action{margin:var(--ln) 0;white-space:pre-wrap}
.e-char{text-transform:uppercase;margin:var(--ln) 0 0 calc(var(--x-char) * var(--in))}
.e-paren{margin:0 0 0 calc(var(--x-paren) * var(--in))}
.e-dlg{margin:0 calc(var(--x-dlgr) * var(--in)) 0 calc(var(--x-dlg) * var(--in));white-space:pre-wrap}
.e-trans{text-align:right;text-transform:uppercase;font-weight:700;margin:var(--ln) 0}
.e-ctr{text-align:center;margin:var(--ln) 0}
.e-lyric{font-style:italic;margin:0 0 0 calc(var(--x-dlg) * var(--in))}
.e-more{margin:0 0 0 calc(var(--x-char) * var(--in))}
.e-contd{text-transform:uppercase;margin:var(--ln) 0 0 calc(var(--x-char) * var(--in))}
.e-sec{color:var(--gold-deep);font-weight:700;margin:var(--ln) 0 0;
  border-bottom:1px solid rgba(0,0,0,.12);padding-bottom:calc(.04 * var(--in))}
.e-syn{font-style:italic;color:#6b6045;margin:calc(.08 * var(--in)) 0;
  padding-left:calc(.12 * var(--in));border-left:2px solid #c3a771}
.e-note{background:#fbf0a4;color:#584812;border-radius:2px;padding:0 .25em}

/* dual dialogue — two 3in columns inside the 6in text block.
   Both columns use identical relative indents (industry standard). */
.e-dual{display:flex;margin:var(--ln) 0 0}
.e-dual>div{flex:0 0 50%;min-width:0}
.e-dual .e-char{margin:0 0 0 calc(var(--d-char) * var(--in))}
.e-dual .e-paren{margin:0 0 0 calc(var(--d-paren) * var(--in))}
.e-dual .e-dlg{margin:0 calc(var(--d-dlg) * var(--in))}

/* title page */
.tp{text-align:center;padding-top:calc(3 * var(--in))}
.tp .t{text-transform:uppercase;font-weight:700;margin-bottom:calc(.5 * var(--in))}
.tp .by{margin-bottom:calc(.12 * var(--in))}
.tp .au{margin-bottom:calc(.5 * var(--in))}
.tp .x{font-size:calc(14px * var(--page-scale));margin-top:calc(.2 * var(--in))}
.tp-foot{
  position:absolute;left:calc(var(--m-l) * var(--in));right:calc(var(--m-r) * var(--in));
  bottom:calc(var(--m-b) * var(--in));display:flex;justify-content:space-between;gap:1em;
}
.tp-foot .r{text-align:right}

.page-empty{
  background:none;box-shadow:none;min-height:0;color:var(--ink-faint);
  text-align:center;font-style:italic;font-size:13px;padding:22vh 20px;width:auto;
}

/* zoom hud */
.zoom{
  position:absolute;right:12px;bottom:calc(12px + var(--safe-b));z-index:8;
  display:flex;align-items:center;gap:2px;padding:3px;border-radius:20px;
  background:rgba(12,11,7,.9);border:1px solid var(--rule);backdrop-filter:blur(8px);
}
.zoom button{width:32px;height:32px;border:none;border-radius:50%;background:none;color:var(--ink);font-size:15px}
.zoom button:active{background:var(--gold);color:var(--bg)}
.zoom span{min-width:36px;text-align:center;font-size:10px;color:var(--ink-faint);letter-spacing:.6px}

/* ═══════════════════════════════════════════════════════════════════════
   5. OVERLAYS  (drawer · sheet · fullscreen · toast)
   ═══════════════════════════════════════════════════════════════════════ */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);opacity:0;
  pointer-events:none;transition:opacity .22s}
.scrim[data-on]{opacity:1;pointer-events:auto}

#drawer{
  position:fixed;z-index:41;top:0;right:0;height:100dvh;width:312px;max-width:86vw;
  display:flex;flex-direction:column;background:var(--bg-1);
  border-left:1px solid var(--rule);box-shadow:-10px 0 28px rgba(0,0,0,.5);
  transform:translateX(100%);transition:transform .26s cubic-bezier(.3,.8,.4,1);
  padding-top:var(--safe-t);
}
#drawer[data-on]{transform:none}
.drawer-hd{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid var(--rule)}
.drawer-hd h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
.drawer-bd{flex:1;overflow-y:auto;padding:4px 0 calc(12px + var(--safe-b))}
.grp{padding:12px 14px 3px;font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--ink-faint)}
.item{
  display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px;
  background:none;border:none;color:var(--ink);font-size:13px;text-align:left;
}
.item:active{background:var(--bg-2)}
.item i{flex:0 0 17px;font-style:normal;text-align:center;color:var(--gold);font-size:13px}
.item.danger,.item.danger i{color:var(--red)}
.item .tag{
  margin-left:auto;font-size:9px;letter-spacing:.6px;padding:2px 7px;border-radius:9px;
  background:var(--rule);color:var(--ink-faint);
}
.item[data-on] .tag{background:var(--gold);color:var(--bg)}

/* bottom sheet modal */
#sheetWrap{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center}
#sheetWrap[data-on]{display:flex}
#sheet{
  width:100%;max-width:460px;max-height:88dvh;overflow-y:auto;
  background:var(--bg-1);border:1px solid var(--rule);border-bottom:none;
  border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--safe-b));
  box-shadow:0 -10px 34px rgba(0,0,0,.55);
  transform:translateY(12px);transition:transform .2s;
}
#sheetWrap[data-on] #sheet{transform:none}
#sheet h3{margin:2px 0 10px;font-family:var(--serif);font-size:21px;font-weight:600;color:var(--gold)}
#sheet h4{margin:0 0 5px;font-family:var(--serif);font-size:15px;font-weight:600;color:var(--gold)}
#sheet p,#sheet li{font-size:12.5px;line-height:1.62;color:var(--ink)}
#sheet p.dim{color:var(--ink-dim);font-size:11.5px}
#sheet code{background:var(--bg);padding:1px 5px;border-radius:3px;color:var(--gold);font-size:11px;word-break:break-all}
.field{
  width:100%;padding:9px;margin:5px 0;border-radius:6px;font-family:var(--mono);font-size:12px;
  background:var(--bg);border:1px solid var(--rule);color:var(--ink);
}
.btns{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;margin-top:14px}
.btn{
  padding:8px 14px;border-radius:6px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;
  background:var(--bg);border:1px solid var(--rule);color:var(--ink);
}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700}
.btn.dngr{border-color:#57231d;color:var(--red)}
.btn.sm{padding:4px 8px;font-size:10px;letter-spacing:.3px;text-transform:none}
.card{background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:11px;margin:8px 0}
.card.ok{background:#11200f;border-color:#22401f}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:none}
.row .main{flex:1;min-width:0}
.row .ttl{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ttl.cur{color:var(--gold)}
.row .sub{font-size:9.5px;color:var(--ink-faint);margin-top:2px}
.row .acts{display:flex;gap:5px;flex-shrink:0}
.meter{height:4px;border-radius:2px;background:var(--rule);overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:2px}
.meter i.warn{background:var(--red)}
.diff{
  margin-top:9px;padding:8px;max-height:44dvh;overflow:auto;border-radius:6px;
  background:var(--bg);border:1px solid var(--rule);font-size:11px;line-height:1.55;
}
.diff s,.diff ins,.diff span{display:block;text-decoration:none;white-space:pre-wrap}
.diff ins{background:rgba(125,183,135,.15);color:var(--green)}
.diff s{background:rgba(207,115,104,.15);color:var(--red);text-decoration:line-through}
.diff span{color:var(--ink-faint)}

/* fullscreen overlay (cards / share viewer) */
.full{
  position:fixed;inset:0;z-index:45;display:none;flex-direction:column;background:var(--bg);
}
.full[data-on]{display:flex}
.full-hd{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:9px 12px;padding-top:max(9px,var(--safe-t));
  background:var(--bg-1);border-bottom:1px solid var(--rule);
}
.full-hd .ttl{flex:1;min-width:0;font-family:var(--serif);font-size:16px;font-weight:600;
  color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.full-hd .sub{font-size:9.5px;color:var(--ink-faint);letter-spacing:.5px;white-space:nowrap}
.full-bd{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}

/* scene cards */
#cardList{display:flex;flex-direction:column;gap:9px;padding:12px 10px calc(12px + var(--safe-b));background:#0c0b07}
.scard{
  background:var(--bg-1);border:1px solid var(--rule);border-radius:9px;padding:11px 12px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:opacity .15s,box-shadow .15s;
}
.scard[data-drag]{opacity:.35}
.scard[data-over]{box-shadow:0 0 0 2px var(--gold)}
.scard .n{font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-faint)}
.scard .h{font-size:12px;font-weight:700;color:#6fb4e8;text-transform:uppercase;margin:3px 0 5px;line-height:1.35}
.scard .a{font-size:11.5px;color:var(--ink-dim);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .who{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.scard .who b{font-weight:400;font-size:8.5px;letter-spacing:.5px;
  background:var(--gold-deep);color:var(--gold);padding:1px 6px;border-radius:8px}
.scard .tm{display:flex;align-items:center;gap:7px;margin-top:8px;padding-top:7px;border-top:1px solid var(--rule)}
.scard .tm i{flex:1;height:3px;border-radius:2px;background:var(--rule);overflow:hidden}
.scard .tm i b{display:block;height:100%;border-radius:2px}
.scard .tm u{text-decoration:none;font-size:9px;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.pace-s b{background:#6fb4e8} .pace-s u{color:#6fb4e8}
.pace-n b{background:#68c2ab} .pace-n u{color:#68c2ab}
.pace-l b{background:var(--gold)} .pace-l u{color:var(--gold)}
.pace-x b{background:var(--red)} .pace-x u{color:var(--red)}
.hint{padding:50px 24px;text-align:center;color:var(--ink-faint);font-size:12.5px;font-style:italic}

/* toast + busy */
#toast{
  position:fixed;left:50%;bottom:calc(26px + var(--safe-b));z-index:70;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:all .26s;
  padding:9px 18px;border-radius:7px;background:var(--gold);color:var(--bg);
  font-size:11.5px;letter-spacing:.7px;box-shadow:0 6px 18px rgba(0,0,0,.45);max-width:84vw;text-align:center;
}
#toast[data-on]{opacity:1;transform:translate(-50%,0)}
#busy{
  position:fixed;inset:0;z-index:80;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:13px;background:rgba(10,9,6,.86);
}
#busy[data-on]{display:flex}
#busy i{width:34px;height:34px;border:3px solid var(--rule);border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite}
#busy p{margin:0;font-size:12px;color:var(--ink-dim)}
@keyframes spin{to{transform:rotate(360deg)}}

   6. PRINT
   ═══════════════════════════════════════════════════════════════════════ */
@media print{
  body{background:#fff;display:block;max-height:none;overflow:visible}
  header,.tabs,#bars,.strip,.zoom,#drawer,.scrim,#sheetWrap,#toast,#busy,.full{display:none!important}
  main{position:static;overflow:visible;height:auto}

  .viewport{overflow:visible;background:#fff;padding:0}
  .page{--page-scale:1!important;margin:0;box-shadow:none;background:#fff;
    page-break-after:always;break-after:page}
}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   FOUNTAIN · PEN
   A single-file screenplay editor.

   Modules, in load order:
     CFG      constants & owner configuration
     U        small shared utilities
     Fountain parser  (text  → tokens)
     Layout   page geometry, wrapping, pagination, timing
     Render   tokens → HTML pages
     PDFOut   tokens → PDF (same geometry as Render)
     Store    localStorage: documents, prefs, drafts
     Syntax   editor colour overlay
     Complete character / location autocomplete
     ActionBar context-aware quick actions
     UI       chrome: tabs, drawer, sheet, toast, zoom
     Cards    scene cards
     Share    compressed share links
     Files    open / link / write real .fountain files on the device
     Voice    dictation
     App      wiring + init
   ═══════════════════════════════════════════════════════════════════════ */

/* ───────────────────────── CFG ───────────────────────── */
const CFG = {
  keys: {
    prefs:    'fp.prefs.v2',
    index:    'fp.index.v2',
    current:  'fp.current.v2',
    doc:      'fp.doc.',
    drafts:   'fp.drafts.v2',
    fileNames:'fp.fileNames.v2',   // docId → last known file name (for display)
    legacy:   'fountain-pen-document-v1'
  },
  idb: { name: 'fountain-pen', store: 'handles', version: 1 },
  storageBudget: 5 * 1024 * 1024
};

/* ───────────────────────── Bus ─────────────────────────
   Modules were previously calling into each other directly (Editor → App,
   Editor → Files, Files → Editor), which only worked because of call
   timing. They now publish and subscribe instead, so load order and unit
   testing stop being load-bearing. */
const Bus = {
  map: {},
  on(evt, fn) { (this.map[evt] = this.map[evt] || []).push(fn); },
  emit(evt, data) {
    (this.map[evt] || []).forEach(fn => {
      try { fn(data); } catch (e) { console.error('[' + evt + ']', e); }
    });
  },
  state: { pane: 'write' }
};

/* ───────────────────────── U ───────────────────────── */
const U = {
  $:  (s, r) => (r || document).querySelector(s),
  $$: (s, r) => Array.from((r || document).querySelectorAll(s)),
  /* Escapes for BOTH text nodes and quoted attributes. Quotes must be
     included: several sheets interpolate user text into value="…". */
  esc: s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                     .replace(/"/g, '&quot;').replace(/'/g, '&#39;'),
  id: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
  debounce(fn, ms) {
    let t; const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    d.cancel = () => clearTimeout(t); d.now = (...a) => { clearTimeout(t); fn(...a); };
    return d;
  },
  words: t => { const s = t.trim(); return s ? s.split(/\s+/).length : 0; },
  slug: (s, n) => (String(s).replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '_').slice(0, n || 48) || 'screenplay'),
  when: d => new Date(d).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }),
  async clip(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }
};

/* ═══════════════════════════════════════════════════════════════════════
   FOUNTAIN — parser

   Strategy: split the body into BLOCKS separated by genuinely empty lines,
   then classify each block as a whole. This is closer to how the spec is
   written than a line-at-a-time state machine, and it makes the awkward
   cases fall out for free:
     · a whitespace-only line inside dialogue is a pause, not a break
     · a tab-indented line inside dialogue is still dialogue
     · a character cue with nothing after it is action, not a cue

   Token shapes
     {type:'scene',    text, sceneNum}
     {type:'action',   text}
     {type:'character',text, dual}
     {type:'paren',    text}
     {type:'dialogue', text}
     {type:'dual',     left:[...], right:[...]}
     {type:'transition'|'centered'|'lyric'|'section'|'synopsis', text, level?}
     {type:'pagebreak'}
     {type:'more'|'contd', text}          ← added later, during pagination
   ═══════════════════════════════════════════════════════════════════════ */
const Fountain = (() => {

  const RE = {
    scene:    /^(?:INT|EXT|EST|INT\.?\/EXT|I\/E)[\.\s]/i,
    transition: /^[A-Z][A-Z0-9\s]*TO:$/,
    centered: /^>\s*(.+?)\s*<$/,
    sceneNum: /\s*#([^#\n]+)#\s*$/,
    section:  /^(#{1,6})\s+(.+)$/,
    titleKey: /^([A-Za-z][A-Za-z0-9 \t_-]*):[ \t]*(.*)$/,
    paren:    /^\(.*\)$/
  };

  /* A leading `Word:` line is not enough to call something a title page —
     "FADE IN:" and "CUT TO:" both match that shape. At least one
     recognised key must be present and carry a value. */
  const TITLE_KEYS = new Set(['title', 'credit', 'author', 'authors', 'source',
    'draft date', 'date', 'contact', 'copyright', 'revision', 'notes', 'info']);
  const looksLikeTitlePage = tp => Object.keys(tp).some(k => TITLE_KEYS.has(k) && tp[k]);

  /* Fountain says any ALL-CAPS line followed by text is a character cue,
     which means "THE DOOR SLAMS." becomes a cue. Real scripts do that
     constantly, so a capitalised sentence — three or more words ending in
     terminal punctuation — is treated as action. Force a cue with @. */
  function readsAsSentence(line) {
    const s = line.replace(/\^\s*$/, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
    return /[.!?]$/.test(s) && s.split(/\s+/).length >= 3;
  }

  /* A character cue is ALL CAPS, may carry (EXTENSIONS) and a trailing ^ */
  function isCue(line) {
    if (!line) return false;
    let s = line.replace(/\^\s*$/, '').trim().replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (!s || s.length > 60) return false;
    if (!/[A-Z]/.test(s)) return false;
    if (/[a-z]/.test(s)) return false;
    return true;
  }

  function parseTitlePage(raw) {
    const tp = {}; let key = null;
    for (const line of raw.split('\n')) {
      const m = line.match(RE.titleKey);
      if (m) {
        key = m[1].trim().toLowerCase().replace(/[\s_-]+/g, ' ');
        tp[key] = m[2].trim() ? [m[2].trim()] : [];
      } else if (key && line.trim()) {
        tp[key].push(line.trim());
      }
    }
    for (const k of Object.keys(tp)) tp[k] = tp[k].join('\n');
    return tp;
  }

  /* Remove boneyard comments. One that occupied a whole line is deleted
     along with the line, otherwise the blank it leaves behind would split
     the surrounding paragraph into two separate blocks. */
  function stripBoneyard(src) {
    const MARK = '\u0000';
    return src.replace(/\/\*[\s\S]*?\*\//g, MARK)
      .split('\n')
      .filter(l => l.trim() !== MARK)
      .map(l => l.split(MARK).join(''))
      .join('\n');
  }

  /* Split body into blocks of consecutive non-empty lines.
     "Empty" means zero length after removing \r — a line of spaces is NOT
     empty, which is exactly how a dialogue pause is written. */
  function toBlocks(body) {
    const blocks = []; let cur = null;
    body.split('\n').forEach((line, i) => {
      if (line.length === 0) { cur = null; return; }
      if (!cur) { cur = { lines: [], at: i }; blocks.push(cur); }
      cur.lines.push(line);
    });
    return blocks;
  }

  function classify(block) {
    const lines = block.lines;
    const first = lines[0];
    const t = first.trim();
    const one = lines.length === 1;
    const out = [];

    /* page break ------------------------------------------------------- */
    if (one && /^={3,}$/.test(t)) return [{ type: 'pagebreak' }];

    /* section / synopsis ----------------------------------------------- */
    const sec = t.match(RE.section);
    if (sec) {
      out.push({ type: 'section', level: sec[1].length, text: sec[2] });
      if (lines.length > 1) out.push({ type: 'action', text: lines.slice(1).join('\n') });
      return out;
    }
    if (/^=(?!=)/.test(t)) {
      out.push({ type: 'synopsis', text: t.slice(1).trim() });
      if (lines.length > 1) out.push({ type: 'action', text: lines.slice(1).join('\n') });
      return out;
    }

    /* centered — every line of the block must be centred ---------------- */
    if (lines.every(l => RE.centered.test(l.trim())))
      return lines.map(l => ({ type: 'centered', text: l.trim().match(RE.centered)[1] }));

    /* forced scene (.) --------------------------------------------------- */
    if (/^\.[^.\s]/.test(t)) {
      const body = t.slice(1).trim();
      const n = body.match(RE.sceneNum);
      out.push({ type: 'scene', text: n ? body.slice(0, -n[0].length).trim() : body, sceneNum: n ? n[1].trim() : null });
      if (lines.length > 1) out.push({ type: 'action', text: lines.slice(1).join('\n') });
      return out;
    }

    /* forced transition (>) ---------------------------------------------- */
    if (/^>(?!.*<\s*$)/.test(t)) return [{ type: 'transition', text: t.slice(1).trim() }];

    /* forced action (!) --------------------------------------------------- */
    if (t.startsWith('!')) {
      return [{ type: 'action', text: [first.replace(/^\s*!/, '')].concat(lines.slice(1)).join('\n') }];
    }

    /* lyric (~) ----------------------------------------------------------- */
    if (t.startsWith('~')) {
      return lines.map(l => ({ type: 'lyric', text: l.replace(/^\s*~/, '').trim() }));
    }

    /* auto scene heading --------------------------------------------------- */
    if (RE.scene.test(t)) {
      const n = t.match(RE.sceneNum);
      out.push({ type: 'scene', text: n ? t.slice(0, -n[0].length).trim() : t, sceneNum: n ? n[1].trim() : null });
      if (lines.length > 1) out.push({ type: 'action', text: lines.slice(1).join('\n') });
      return out;
    }

    /* auto transition ------------------------------------------------------ */
    if (one && RE.transition.test(t)) return [{ type: 'transition', text: t }];

    /* dialogue block — a cue with at least one line beneath it ------------- */
    const forcedCue = t.startsWith('@');
    if ((forcedCue || (isCue(t) && !readsAsSentence(t))) && lines.length > 1) {
      let cue = forcedCue ? t.slice(1).trim() : t;
      const dual = /\^\s*$/.test(cue);
      if (dual) cue = cue.replace(/\^\s*$/, '').trim();
      out.push({ type: 'character', text: cue, dual });

      let buf = [];
      const flush = () => { if (buf.length) { out.push({ type: 'dialogue', text: buf.join('\n') }); buf = []; } };
      for (const raw of lines.slice(1)) {
        const line = raw.trim();
        if (RE.paren.test(line)) { flush(); out.push({ type: 'paren', text: line }); }
        else buf.push(line);           // '' here is a deliberate pause line
      }
      flush();
      return out;
    }

    /* default: action ------------------------------------------------------ */
    return [{ type: 'action', text: lines.join('\n') }];
  }

  /* A cue marked ^ joins the dialogue block immediately before it. */
  function pairDual(tokens) {
    const out = [];
    for (let i = 0; i < tokens.length; i++) {
      const tk = tokens[i];
      if (tk.type !== 'character' || !tk.dual) { out.push(tk); continue; }

      const right = [{ ...tk, dual: false }];
      let j = i + 1;
      while (j < tokens.length && (tokens[j].type === 'dialogue' || tokens[j].type === 'paren')) right.push(tokens[j++]);
      i = j - 1;

      const left = [];
      while (out.length) {
        const p = out[out.length - 1];
        if (p.type === 'dialogue' || p.type === 'paren') { left.unshift(out.pop()); continue; }
        if (p.type === 'character') { left.unshift(out.pop()); break; }
        break;
      }
      if (!left.length) { out.push(...right); continue; }  // nothing to pair with
      out.push({ type: 'dual', left, right });
    }
    return out;
  }

  function parse(text) {
    if (!text || !text.trim()) return { title: null, tokens: [] };

    let src = stripBoneyard(String(text).replace(/\r\n?/g, '\n'));

    let title = null, body = src;
    const split = src.match(/^([\s\S]*?)\n[ \t]*\n([\s\S]*)$/);
    const head = split ? split[1] : src;
    if (RE.titleKey.test(head.split('\n')[0] || '')) {
      const candidate = parseTitlePage(head);
      if (looksLikeTitlePage(candidate)) { title = candidate; body = split ? split[2] : ''; }
    }

    const tokens = [];
    for (const b of toBlocks(body)) tokens.push(...classify(b));
    return { title, tokens: pairDual(tokens) };
  }

  /* ── inline emphasis ───────────────────────────────────────────────
     One table drives both the HTML renderer and the plain-text extractor,
     so what the PDF measures can never drift from what the preview shows.
     A delimiter only counts when it is not wedged between word characters,
     which keeps snake_case_names and 2*3*4 intact.                      */
  const EMPH = [
    [/(^|[^\w*\\])\*\*\*(\S(?:[^\n]*?\S)?)\*\*\*(?![\w*])/g, '$1<strong><em>$2</em></strong>', '$1$2'],
    [/(^|[^\w*\\])\*\*(\S(?:[^\n]*?\S)?)\*\*(?![\w*])/g,     '$1<strong>$2</strong>',          '$1$2'],
    [/(^|[^\w*\\])\*(\S(?:[^*\n]*?\S)?)\*(?![\w*])/g,        '$1<em>$2</em>',                  '$1$2'],
    [/(^|[^\w_\\])_(\S(?:[^_\n]*?\S)?)_(?![\w_])/g,          '$1<u>$2</u>',                    '$1$2']
  ];
  const UNESCAPE = /\\([*_[\]])/g;

  function inline(text) {
    let s = U.esc(text);
    s = s.replace(/\[\[([\s\S]+?)\]\]/g, '<span class="e-note">$1</span>');
    EMPH.forEach(([re, html]) => { s = s.replace(re, html); });
    return s.replace(UNESCAPE, '$1');
  }

  /* Plain text for measuring and for the PDF. */
  function plain(text) {
    let s = String(text).replace(/\[\[[\s\S]*?\]\]/g, '');
    EMPH.forEach(([re, , bare]) => { s = s.replace(re, bare); });
    return s.replace(UNESCAPE, '$1');
  }

  return { parse, inline, plain, isCue, RE };
})();

/* ═══════════════════════════════════════════════════════════════════════
   LAYOUT — one source of truth for page geometry.

   US Letter, 12pt Courier: 10 characters per inch, 6 lines per inch.
   Text block runs 1.5in → 7.5in (6in wide, 60 characters, 54 lines).
   Every measurement below is in inches; the CSS mirrors them via --in.
   ═══════════════════════════════════════════════════════════════════════ */
const Layout = (() => {
  const G = {
    w: 8.5, h: 11,
    ml: 1.5, mr: 1.0, mt: 1.0, mb: 1.0,
    cpi: 10, lpi: 6,
    charX: 3.7, parenX: 3.1, dlgX: 2.5, dlgW: 3.5,
    dual: { colW: 3.0, dlgIn: 0.2, parenIn: 0.5, charIn: 1.0, dlgW: 2.6, parenW: 2.3, charW: 2.0 }
  };
  G.textW = G.w - G.ml - G.mr;                        // 6.0
  G.linesPerPage = Math.floor((G.h - G.mt - G.mb) * G.lpi);   // 54

  const chars = inches => Math.max(4, Math.floor(inches * G.cpi));
  const W = {
    action:    chars(G.textW),        // 60
    dialogue:  chars(G.dlgW),         // 35
    paren:     chars(2.5),            // 25
    character: chars(3.0),            // 30
    transition:chars(G.textW),
    centered:  chars(G.textW),
    lyric:     chars(G.dlgW),
    dualDlg:   chars(G.dual.dlgW),    // 26
    dualParen: chars(G.dual.parenW),  // 23
    dualChar:  chars(G.dual.charW)    // 20
  };

  /* Greedy word wrap at a character count — Courier is monospaced, so
     character counts and inches are interchangeable. */
  function wrap(text, max) {
    const out = [];
    String(text == null ? '' : text).split('\n').forEach(para => {
      if (para.length <= max) { out.push(para); return; }
      let line = '';
      for (const word of para.split(' ')) {
        if (!line) { line = word; }
        else if ((line + ' ' + word).length > max) { out.push(line); line = word; }
        else { line += ' ' + word; }
        while (line.length > max) { out.push(line.slice(0, max)); line = line.slice(max); }
      }
      out.push(line);
    });
    return out.length ? out : [''];
  }

  const P = Fountain.plain;

  /* Printed lines a token occupies, including the blank line that precedes
     it. `tok.cont` marks the tail of a token split across a page break —
     it gets no leading blank. */
  /* height() is asked for the same token many times per keystroke (stats,
     pagination, runtime), and each call re-wraps its text. Memoise on the
     token object itself — tokens are immutable once parsed. */
  const hCache = new WeakMap();
  function height(tok) {
    const hit = hCache.get(tok);
    if (hit !== undefined) return hit;
    const v = measure(tok);
    hCache.set(tok, v);
    return v;
  }

  function measure(tok) {
    const lead = tok.cont ? 0 : 1;
    switch (tok.type) {
      case 'scene':      return lead + wrap(P(tok.text), W.action).length + 1;
      case 'action':     return lead + wrap(P(tok.text), W.action).length;
      case 'character':  return lead + 1;
      case 'paren':      return wrap(P(tok.text), W.paren).length;
      case 'dialogue':   return wrap(P(tok.text), W.dialogue).length;
      case 'lyric':      return wrap(P(tok.text), W.lyric).length;
      case 'transition': return lead + wrap(P(tok.text), W.transition).length + 1;
      case 'centered':   return lead + wrap(P(tok.text), W.centered).length;
      case 'section':    return lead + 1;
      case 'synopsis':   return 1;
      case 'more':       return 1;
      case 'contd':      return lead + 1;
      case 'dual': {
        /* The first element of each column loses its leading blank, which we
           subtract rather than cloning the token (cloning defeats the cache). */
        const col = arr => arr.reduce((n, t, i) => n + height(t) - (i === 0 && !t.cont ? 1 : 0), 0);
        return lead + Math.max(col(tok.left), col(tok.right));
      }
      default: return 1;
    }
  }

  const cueName = raw => P(raw).replace(/\s*\([^)]*\)\s*$/, '').trim();

  /* Break the token stream into pages, splitting long dialogue and action
     across page boundaries and inserting (MORE) / (CONT'D). */
  /* Pagination is requested by the stats bar, the preview and the PDF on
     the same token array. Cache it against that array so one parse costs
     exactly one pagination. */
  const pCache = new WeakMap();
  function paginate(tokens) {
    const hit = pCache.get(tokens);
    if (hit) return hit;
    const pages = layout(tokens);
    pCache.set(tokens, pages);
    return pages;
  }

  function layout(tokens) {
    const queue = tokens.slice();
    const pages = [];
    let page = [], used = 0, cue = null;

    const flush = () => { if (page.length) { pages.push(page); page = []; used = 0; } };
    const room  = () => G.linesPerPage - used;
    const place = (tok, h) => { page.push(tok); used += (h == null ? height(tok) : h); };

    for (let i = 0; i < queue.length; i++) {
      const tok = queue[i];

      if (tok.type === 'pagebreak') { flush(); continue; }
      if (tok.type === 'character') cue = tok.text;

      const h = height(tok);
      if (h <= room()) { place(tok, h); continue; }

      /* Split dialogue: keep what fits, reserve a line for (MORE). */
      if (tok.type === 'dialogue' && cue && room() >= 3) {
        const lines = wrap(P(tok.text), W.dialogue);
        const take = room() - 1;
        if (take >= 2 && lines.length - take >= 1) {
          place({ type: 'dialogue', text: lines.slice(0, take).join('\n'), cont: tok.cont });
          place({ type: 'more', text: '(MORE)' });
          flush();
          place({ type: 'contd', text: cueName(cue) + " (CONT'D)" });
          queue.splice(i + 1, 0, { type: 'dialogue', text: lines.slice(take).join('\n'), cont: true });
          continue;
        }
      }

      /* Split action on any page with room for a couple of lines. */
      if (tok.type === 'action' && room() >= 3) {
        const lines = wrap(P(tok.text), W.action);
        const take = room() - (tok.cont ? 0 : 1);
        if (take >= 2 && lines.length - take >= 1) {
          place({ type: 'action', text: lines.slice(0, take).join('\n'), cont: tok.cont });
          flush();
          queue.splice(i + 1, 0, { type: 'action', text: lines.slice(take).join('\n'), cont: true });
          continue;
        }
      }

      /* Otherwise move the whole element to the next page. A character cue
         must never be orphaned, so carry it forward with its dialogue. */
      flush();
      place(tok, h);
    }
    flush();
    return pages;
  }

  /* ── screen time ────────────────────────────────────────────────────
     One page ≈ one minute. Dialogue is spoken faster than action reads,
     so it is weighted slightly below its line count.                  */
  const WEIGHT = { dialogue: .85, paren: .75, lyric: .9, section: 0, synopsis: 0 };
  function minutes(tokens) {
    let lines = 0;
    const walk = list => list.forEach(t => {
      if (t.type === 'dual') { walk(t.left); walk(t.right); return; }
      lines += height(t) * (WEIGHT[t.type] == null ? 1 : WEIGHT[t.type]);
    });
    walk(tokens);
    return lines / G.linesPerPage;
  }
  function clock(mins) {
    if (mins < 1) return '~' + Math.max(1, Math.round(mins * 60)) + 's';
    const h = Math.floor(mins / 60), m = Math.round(mins % 60);
    return h ? `~${h}h ${m}m` : `~${m}m`;
  }
  function span(mins) {
    if (mins < 0.5) return '<30s';
    const s = Math.round(mins * 60), m = Math.floor(s / 60), r = s % 60;
    if (!m) return s + 's';
    return r ? `${m}m ${r}s` : `${m}m`;
  }
  const pace = m => m < 1 ? 'pace-s' : m < 3 ? 'pace-n' : m < 5 ? 'pace-l' : 'pace-x';

  /* The single place page geometry becomes CSS. `pip` trades the 1.5in
     binding margin for a symmetric 1in one; every left indent moves with
     it so the page keeps its proportions. Print and PDF ignore pip. */
  function cssVars(pip) {
    const ml = pip ? G.mr : G.ml;              // pip drops the binding margin
    /* Indents are measured from the left edge of the text block, so they do
       not change with pip: shrinking the padding slides the whole block
       left by the same half inch and the page keeps its proportions. */
    return {
      '--pg-w': G.w, '--pg-h': G.h,
      '--m-t': G.mt, '--m-r': G.mr, '--m-b': G.mb, '--m-l': ml,
      '--x-char':  G.charX  - G.ml,
      '--x-paren': G.parenX - G.ml,
      '--x-dlg':   G.dlgX   - G.ml,
      '--x-dlgr':  G.w - G.mr - (G.dlgX + G.dlgW),
      '--d-char':  G.dual.charIn, '--d-paren': G.dual.parenIn, '--d-dlg': G.dual.dlgIn,
      '--sn-l': 0.9, '--sn-r': 0.55
    };
  }

  return { G, W, wrap, height, paginate, minutes, clock, span, pace, cueName, cssVars };
})();

/* ═══════════════════════════════════════════════════════════════════════
   RENDER — tokens → paginated HTML pages
   ═══════════════════════════════════════════════════════════════════════ */
const Render = (() => {
  const fx = t => Fountain.inline(t).replace(/\n/g, '<br>');

  function token(tok) {
    switch (tok.type) {
      case 'scene':
        if (!tok.sceneNum) return `<div class="e-scene">${fx(tok.text)}</div>`;
        return `<div class="e-scene num"><span class="sn-l">${U.esc(tok.sceneNum)}</span>` +
               `<span class="sn-r">${U.esc(tok.sceneNum)}</span>${fx(tok.text)}</div>`;
      case 'action':     return `<div class="e-action">${fx(tok.text)}</div>`;
      case 'character':  return `<div class="e-char">${fx(tok.text)}</div>`;
      case 'paren':      return `<div class="e-paren">${fx(tok.text)}</div>`;
      case 'dialogue':   return `<div class="e-dlg">${fx(tok.text)}</div>`;
      case 'transition': return `<div class="e-trans">${fx(tok.text)}</div>`;
      case 'centered':   return `<div class="e-ctr">${fx(tok.text)}</div>`;
      case 'lyric':      return `<div class="e-lyric">${fx(tok.text)}</div>`;
      case 'section':    return `<div class="e-sec">${fx(tok.text)}</div>`;
      case 'synopsis':   return `<div class="e-syn">${fx(tok.text)}</div>`;
      case 'more':       return `<div class="e-more">${U.esc(tok.text)}</div>`;
      case 'contd':      return `<div class="e-contd">${U.esc(tok.text)}</div>`;
      case 'dual':
        return `<div class="e-dual"><div>${tok.left.map(token).join('')}</div>` +
               `<div>${tok.right.map(token).join('')}</div></div>`;
      default: return '';
    }
  }

  function titlePage(tp) {
    const get = k => tp[k] || '';
    const date = get('draft date') || get('draft_date') || get('date');
    let h = '<div class="page" data-folio=""><div class="tp">';
    if (get('title'))  h += `<div class="t">${fx(get('title'))}</div>`;
    if (get('credit')) h += `<div class="by">${fx(get('credit'))}</div>`;
    else if (get('author') || get('authors')) h += '<div class="by">written by</div>';
    if (get('author'))  h += `<div class="au">${fx(get('author'))}</div>`;
    if (get('authors')) h += `<div class="au">${fx(get('authors'))}</div>`;
    if (get('source'))  h += `<div class="x">${fx(get('source'))}</div>`;
    ['revision', 'copyright', 'notes', 'info'].forEach(k => {
      if (get(k)) h += `<div class="x">${fx(get(k))}</div>`;
    });
    h += '</div>';
    if (date || get('contact')) {
      h += `<div class="tp-foot"><div>${date ? fx(date) : ''}</div>` +
           `<div class="r">${get('contact') ? fx(get('contact')) : ''}</div></div>`;
    }
    return h + '</div>';
  }

  /* Returns { html, pages } so callers can reuse the page count. */
  function document_(parsed) {
    const { title, tokens } = parsed;
    if (!tokens.length && !title) {
      return { html: '<div class="page page-empty">Start writing in the Write tab and your screenplay appears here, formatted.</div>', pages: [] };
    }
    const pages = Layout.paginate(tokens);
    let html = title ? titlePage(title) : '';
    pages.forEach((page, i) => {
      const folio = i === 0 ? '' : (i + 1) + '.';
      html += `<div class="page" data-folio="${folio}">${page.map(token).join('')}</div>`;
    });
    return { html, pages };
  }

  return { document: document_, token };
})();

/* ═══════════════════════════════════════════════════════════════════════
   PDFOUT — tokens → PDF

   Consumes the *same* paginated pages as the preview, so the two can never
   drift apart: page breaks, (MORE)/(CONT'D) and scene numbers are decided
   once, in Layout.paginate().
   ═══════════════════════════════════════════════════════════════════════ */
const PDFOut = (() => {
  const G = Layout.G, W = Layout.W, P = Fountain.plain;
  const LH = 1 / G.lpi;

  function build(parsed) {
    if (!window.jspdf) throw new Error('PDF library still loading — try again in a moment.');
    const doc = new window.jspdf.jsPDF({ unit: 'in', format: 'letter' });
    doc.setFont('Courier', 'normal');
    doc.setFontSize(12);

    let y = G.mt;
    const at = (text, x, opt) => doc.text(text, x, y, opt);
    const lines = (arr, x, opt) => arr.forEach(l => { at(opt && opt.upper ? l.toUpperCase() : l, x, opt); y += LH; });
    const block = (text, x, max, opt) => lines(Layout.wrap(P(text), max), x, opt);
    const gap = () => { y += LH; };

    /* ── title page ────────────────────────────────────────────────── */
    const tp = parsed.title;
    if (tp) {
      const cx = G.w / 2, get = k => tp[k] ? P(tp[k]) : '';
      let ty = G.h * 0.38;
      const centre = (t, size) => {
        doc.setFontSize(size || 12);
        t.split('\n').forEach(l => { doc.text(l, cx, ty, { align: 'center' }); ty += LH; });
        doc.setFontSize(12);
      };
      if (get('title')) { centre(get('title').toUpperCase(), 14); ty += LH * 2; }
      if (get('credit')) { centre(get('credit')); }
      else if (get('author') || get('authors')) centre('written by');
      if (get('author'))  { centre(get('author')); ty += LH * 2; }
      if (get('authors')) { centre(get('authors')); ty += LH * 2; }
      if (get('source'))  centre(get('source'));
      ['revision', 'copyright', 'notes', 'info'].forEach(k => { if (get(k)) { ty += LH; centre(get(k)); } });

      const date = get('draft date') || get('draft_date') || get('date');
      if (date) doc.text(date.split('\n')[0], G.ml, G.h - G.mb);
      if (get('contact')) {
        const cl = get('contact').split('\n');
        let cy = G.h - G.mb - (cl.length - 1) * LH;
        cl.forEach(l => { doc.text(l, G.w - G.mr, cy, { align: 'right' }); cy += LH; });
      }
      doc.addPage();
    }

    /* ── body ──────────────────────────────────────────────────────── */
    const pages = Layout.paginate(parsed.tokens);

    const emit = tok => {
      switch (tok.type) {
        case 'scene':
          if (!tok.cont) gap();
          if (tok.sceneNum) {
            const n = P(tok.sceneNum);
            doc.text(n, G.ml - 0.5, y);
            doc.text(n, G.w - G.mr, y, { align: 'right' });
          }
          block(tok.text, G.ml, W.action, { upper: true });
          gap();
          break;
        case 'action':
          if (!tok.cont) gap();
          block(tok.text, G.ml, W.action);
          break;
        case 'character':
          if (!tok.cont) gap();
          block(tok.text, G.charX, W.character, { upper: true });
          break;
        case 'paren':    block(tok.text, G.parenX, W.paren); break;
        case 'dialogue': block(tok.text, G.dlgX, W.dialogue); break;
        case 'lyric':    block(tok.text, G.dlgX, W.lyric); break;
        case 'transition':
          if (!tok.cont) gap();
          block(tok.text, G.w - G.mr, W.transition, { upper: true, align: 'right' });
          gap();
          break;
        case 'centered':
          if (!tok.cont) gap();
          block(tok.text, G.w / 2, W.centered, { align: 'center' });
          break;
        case 'more':
          block(tok.text, G.charX, W.character);
          break;
        case 'contd':
          if (!tok.cont) gap();
          block(tok.text, G.charX, W.character, { upper: true });
          break;
        case 'dual': {
          if (!tok.cont) gap();
          const D = G.dual;
          const colX = side => (side === 'left' ? G.ml : G.ml + D.colW);
          const top = y;
          let tallest = y;
          ['left', 'right'].forEach(side => {
            y = top;
            const base = colX(side);
            (side === 'left' ? tok.left : tok.right).forEach(t => {
              if (t.type === 'character') block(t.text, base + D.charIn, W.dualChar, { upper: true });
              else if (t.type === 'paren') block(t.text, base + D.parenIn, W.dualParen);
              else if (t.type === 'dialogue' || t.type === 'lyric') block(t.text, base + D.dlgIn, W.dualDlg);
            });
            if (y > tallest) tallest = y;
          });
          y = tallest;
          break;
        }
        /* sections and synopses are outline metadata — not printed */
        case 'section': case 'synopsis': default: break;
      }
    };

    pages.forEach((page, i) => {
      if (i > 0) doc.addPage();
      y = G.mt;
      if (i > 0) doc.text((i + 1) + '.', G.w - G.mr, 0.5, { align: 'right' });
      page.forEach(emit);
    });

    return doc;
  }

  return { build };
})();

/* ═══════════════════════════════════════════════════════════════════════
   STORE — documents, preferences, drafts

   Each screenplay is stored under its own key (fp.doc.<id>) with a light
   index listing titles and metadata. Nothing is keyed to the file path, so
   moving or re-uploading the page never orphans the library.
   ═══════════════════════════════════════════════════════════════════════ */
const Store = (() => {
  const K = CFG.keys;
  const read = (k, fb) => { try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch { return fb; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

  const prefs = Object.assign({ autocomplete: true, syntax: false, pip: false }, read(K.prefs, {}));
  const savePrefs = () => write(K.prefs, prefs);

  const index = () => read(K.index, []);
  const setIndex = list => write(K.index, list);
  const meta = id => index().find(d => d.id === id) || null;
  const patchMeta = (id, patch) => {
    const list = index(); const i = list.findIndex(d => d.id === id);
    if (i < 0) return; Object.assign(list[i], patch); setIndex(list);
  };

  const textOf = id => { try { return localStorage.getItem(K.doc + id) || ''; } catch { return ''; } };
  const saveText = (id, text) => { try { localStorage.setItem(K.doc + id, text); return true; } catch { return false; } };

  function create(title, text) {
    const id = U.id();
    const list = index();
    list.unshift({ id, title: title || 'Untitled', words: U.words(text || ''), updated: U.when(Date.now()), created: U.when(Date.now()) });
    setIndex(list); saveText(id, text || '');
    return id;
  }
  function remove(id) {
    try { localStorage.removeItem(K.doc + id); } catch {}
    setIndex(index().filter(d => d.id !== id));
    const names = read(K.fileNames, {}); delete names[id]; write(K.fileNames, names);
  }
  const current = () => { try { return localStorage.getItem(K.current); } catch { return null; } };
  const setCurrent = id => { try { localStorage.setItem(K.current, id); } catch {} };

  /* drafts (named snapshots) */
  const drafts = () => read(K.drafts, []);
  function snapshot(name, id, text, pages) {
    const list = drafts();
    list.unshift({ key: U.id(), docId: id, name, at: U.when(Date.now()), text, words: U.words(text), pages });
    while (list.length > 30) list.pop();
    write(K.drafts, list);
    return list;
  }
  const dropDraft = key => write(K.drafts, drafts().filter(d => d.key !== key));

  function usage() {
    let bytes = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        bytes += (k.length + (localStorage.getItem(k) || '').length) * 2;
      }
    } catch {}
    return { bytes, budget: CFG.storageBudget, pct: Math.min(100, bytes / CFG.storageBudget * 100) };
  }

  /* One-time migration from the original single-document build. */
  function migrate(template) {
    let list = index();
    if (!list.length) {
      let legacy = null;
      try { legacy = localStorage.getItem(K.legacy); } catch {}
      if (legacy != null && legacy.trim()) {
        const t = Fountain.parse(legacy).title;
        const id = create((t && t.title) || 'Untitled', legacy);
        setCurrent(id);
        try { localStorage.removeItem(K.legacy); } catch {}
      } else {
        setCurrent(create('Untitled Screenplay', template));
      }
      list = index();
    }
    let id = current();
    if (!id || !meta(id)) { id = list[0].id; setCurrent(id); }
    return id;
  }

  return { prefs, savePrefs, index, setIndex, meta, patchMeta, textOf, saveText,
           create, remove, current, setCurrent, drafts, snapshot, dropDraft, usage, migrate,
           raw: { read, write } };
})();

/* ═══════════════════════════════════════════════════════════════════════
   SYNTAX — colour overlay for the editor

   A div behind a transparent textarea, rendered with identical metrics and
   kept scroll-locked to it. The source characters (including the emphasis
   marks) are all preserved, so the overlay lines up exactly.
   ═══════════════════════════════════════════════════════════════════════ */
const Syntax = (() => {
  const R = Fountain.RE;

  /* Escapes, then tints inline emphasis without removing the markers. */
  function ink(text) {
    let s = U.esc(text);
    s = s.replace(/\[\[([\s\S]*?)\]\]/g, m => `<span class="t-note">${m}</span>`);
    s = s.replace(/\*\*\*[^*\n]+?\*\*\*/g, m => `<span class="t-b t-i">${m}</span>`);
    s = s.replace(/\*\*[^*\n]+?\*\*/g, m => `<span class="t-b">${m}</span>`);
    s = s.replace(/(^|[^*])(\*[^*\n]+?\*)(?!\*)/g, (_, a, b) => a + `<span class="t-i">${b}</span>`);
    s = s.replace(/(^|[^_])(_[^_\n]+?_)/g, (_, a, b) => a + `<span class="t-u">${b}</span>`);
    return s;
  }
  const wrapc = (cls, text) => `<span class="${cls}">${U.esc(text)}</span>`;

  function build(text) {
    const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let inTitle = R.titleKey.test(lines[0] || ''), inDialogue = false;

    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i], t = raw.trim();
      const prevEmpty = i === 0 || lines[i - 1].length === 0;
      const nextLine = lines[i + 1];

      if (raw.length === 0) { out.push(''); inDialogue = false; if (inTitle) inTitle = false; continue; }

      if (inTitle) {
        const m = raw.match(R.titleKey);
        out.push(m ? wrapc('t-key', m[1] + ':') + wrapc('t-val', raw.slice(m[1].length + 1))
                   : wrapc('t-val', raw));
        continue;
      }
      if (/^={3,}$/.test(t))       { out.push(wrapc('t-brk', raw)); inDialogue = false; continue; }
      if (R.section.test(t))       { out.push(wrapc('t-sec', raw)); inDialogue = false; continue; }
      if (/^=(?!=)/.test(t))       { out.push(wrapc('t-syn', raw)); inDialogue = false; continue; }
      if (R.centered.test(t))      { out.push(wrapc('t-ctr', raw)); inDialogue = false; continue; }
      if (/^\.[^.\s]/.test(t))     { out.push(sceneInk(raw)); inDialogue = false; continue; }
      if (/^>(?!.*<\s*$)/.test(t)) { out.push(wrapc('t-trans', raw)); inDialogue = false; continue; }
      if (t.startsWith('!'))       { out.push(`<span class="t-act">${ink(raw)}</span>`); inDialogue = false; continue; }
      if (t.startsWith('~'))       { out.push(wrapc('t-lyric', raw)); continue; }
      if (t.startsWith('@'))       { out.push(cueInk(raw)); inDialogue = true; continue; }

      if (prevEmpty && R.scene.test(t))      { out.push(sceneInk(raw)); inDialogue = false; continue; }
      if (prevEmpty && R.transition.test(t)) { out.push(wrapc('t-trans', raw)); inDialogue = false; continue; }
      if (prevEmpty && Fountain.isCue(t) && nextLine != null && nextLine.length > 0) {
        out.push(cueInk(raw)); inDialogue = true; continue;
      }
      if (inDialogue) {
        out.push(R.paren.test(t) ? wrapc('t-paren', raw) : `<span class="t-dlg">${ink(raw)}</span>`);
        continue;
      }
      out.push(`<span class="t-act">${ink(raw)}</span>`);
    }
    return out.join('\n') + '\n';
  }

  function sceneInk(raw) {
    const m = raw.match(R.sceneNum);
    if (!m) return wrapc('t-scene', raw);
    return wrapc('t-scene', raw.slice(0, -m[0].length)) + wrapc('t-num', m[0]);
  }
  function cueInk(raw) {
    if (!/\^\s*$/.test(raw)) return wrapc('t-char', raw);
    const i = raw.lastIndexOf('^');
    return wrapc('t-char', raw.slice(0, i)) + wrapc('t-dual', raw.slice(i));
  }

  return { build };
})();

/* ═══════════════════════════════════════════════════════════════════════
   COMPLETE — character / location / time-of-day suggestions
   ═══════════════════════════════════════════════════════════════════════ */
const Complete = (() => {
  const STANDARD_TOD = ['DAY', 'NIGHT', 'CONTINUOUS', 'MORNING', 'EVENING', 'LATER',
                        'MOMENTS LATER', 'DAWN', 'DUSK', 'SAME'];
  const PREFIXES = ['INT.', 'EXT.', 'INT./EXT.', 'I/E', 'EST.'];
  let dict = { characters: [], locations: [], times: STANDARD_TOD.slice() };

  function refresh(tokens) {
    const chars = new Map(), locs = new Map(), tods = new Map();
    const bump = (m, k) => k && m.set(k, (m.get(k) || 0) + 1);
    const walk = list => list.forEach(t => {
      if (t.type === 'dual') { walk(t.left); walk(t.right); return; }
      if (t.type === 'character') bump(chars, Layout.cueName(t.text).toUpperCase());
      if (t.type === 'scene') {
        const m = t.text.match(/^(?:INT\.?\/EXT\.?|I\/E|INT\.?|EXT\.?|EST\.?)\s+(.+?)(?:\s+[-–—]\s+(.+))?$/i);
        if (m) { bump(locs, m[1].trim().toUpperCase()); if (m[2]) bump(tods, m[2].trim().toUpperCase()); }
      }
    });
    walk(tokens);
    STANDARD_TOD.forEach(t => { if (!tods.has(t)) tods.set(t, 0); });
    const rank = m => [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(e => e[0]);
    dict = { characters: rank(chars), locations: rank(locs), times: rank(tods) };
  }

  /* Given the editor context, what should be offered and what text is
     being replaced?  Returns null when nothing applies. */
  function suggest(ctx) {
    if (!Store.prefs.autocomplete) return null;
    const { kind, lineStart, beforeInLine } = ctx;

    if (kind === 'character') {
      const at = beforeInLine.startsWith('@') ? 1 : 0;
      const typed = beforeInLine.slice(at).toUpperCase();
      if (typed.length < 1) return null;
      const hits = dict.characters.filter(c => c.startsWith(typed) && c !== typed).slice(0, 8);
      if (!hits.length) return null;
      return { from: lineStart + at, mode: 'character', items: hits.map(v => ({ value: v, kind: 'character' })) };
    }

    if (kind === 'scene') {
      const at = beforeInLine.startsWith('.') ? 1 : 0;
      const line = beforeInLine.slice(at);
      const up = line.toUpperCase();
      const pre = up.match(/^(INT\.?\/EXT\.?|I\/E|INT\.?|EXT\.?|EST\.?)\s+/);

      if (!pre) {
        const hits = PREFIXES.filter(p => p.startsWith(up) && p !== up);
        if (!hits.length) return null;
        return { from: lineStart + at, mode: 'prefix', items: hits.map(v => ({ value: v + ' ', label: v, kind: 'prefix' })) };
      }
      const rest = line.slice(pre[0].length);
      const dash = rest.match(/\s+[-–—]\s+/);
      if (dash) {
        const start = rest.indexOf(dash[0]) + dash[0].length;
        const typed = rest.slice(start).toUpperCase();
        const hits = dict.times.filter(v => v.startsWith(typed) && v !== typed).slice(0, 8);
        if (!hits.length) return null;
        return { from: lineStart + at + pre[0].length + start, mode: 'time', items: hits.map(v => ({ value: v, kind: 'time' })) };
      }
      const typed = rest.toUpperCase();
      if (typed.length < 1) return null;
      const hits = dict.locations.filter(v => v.startsWith(typed) && v !== typed).slice(0, 8);
      if (!hits.length) return null;
      return { from: lineStart + at + pre[0].length, mode: 'location', items: hits.map(v => ({ value: v, kind: 'location' })) };
    }
    return null;
  }

  /* Text appended after accepting, to keep the writer moving. */
  const tail = mode => mode === 'character' ? '\n' : mode === 'location' ? ' - ' : mode === 'time' ? '\n\n' : '';

  return { refresh, suggest, tail, get dict() { return dict; } };
})();

/* ═══════════════════════════════════════════════════════════════════════
   ACTIONBAR — context-aware quick actions
   ═══════════════════════════════════════════════════════════════════════ */
const ActionBar = (() => {
  const SETS = {
    action: [
      { label: 'New Scene', op: 'block', text: 'INT. ' },
      { label: 'Character', op: 'block', text: '' },
